App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
              fields: [city, country]
              message: 'Taka lokalizacja już istnieje.'
              groups: [create, edit]

    properties:
        city:
            - NotBlank:
                  message: 'Podaj nazwę miasta.'
                  groups: [create, edit]
            - Length:
                  min: 2
                  max: 100
                  minMessage: 'Nazwa miasta musi mieć co najmniej {{ limit }} znaki.'
                  maxMessage: 'Nazwa miasta może mieć maksymalnie {{ limit }} znaków.'
                  groups: [create, edit]

        country:
            - NotBlank:
                  message: 'Wybierz kraj.'
                  groups: [create, edit]

        latitude:
            - NotBlank:
                  message: 'Podaj szerokość geograficzną.'
                  groups: [create]
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Szerokość geograficzna musi być z przedziału od {{ min }} do {{ max }}.'
                  groups: [create, edit]

        longitude:
            - NotBlank:
                  message: 'Podaj długość geograficzną.'
                  groups: [create]
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'Długość geograficzna musi być z przedziału od {{ min }} do {{ max }}.'
                  groups: [create, edit]
